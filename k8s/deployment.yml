apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: express
  template:
    metadata:
      labels:
        app: express
    spec:
      containers:
        - name: express-container
          image: k8s_server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            limits:
              # Memory in bytes
              memory: "128Mi"
              # Milicores: 1000m = 1 CPU
              cpu: "500m"
            requests:
              # Memory in bytes
              memory: "64Mi"
              # Milicores: 1000m = 1 CPU
              cpu: "250m"
